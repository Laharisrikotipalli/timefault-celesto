services:
  ledger:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: timefault
      POSTGRES_USER: timefault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-change-me}
    volumes:
      - ledger_data:/var/lib/postgresql/data
      - ./seeds/01_runs.sql:/docker-entrypoint-initdb.d/01_runs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timefault -d timefault"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      API_PORT: "8000"
      DATABASE_URL: postgresql://timefault:${POSTGRES_PASSWORD:-local-dev-only-change-me}@ledger:5432/timefault
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      ledger:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  ledger_data:
